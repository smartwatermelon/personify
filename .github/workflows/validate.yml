name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate SKILL.md structure
        run: python3 scripts/validate_skill.py
      - name: Run structural tests
        # Two failures to catch, not one. A failing test makes unittest exit
        # nonzero, which the step catches on its own. But "Ran 0 tests" exits
        # ZERO, so a broken discovery would pass CI green with nothing run.
        # Capture to a file rather than a pipe: a pipe would report tee's exit
        # status and swallow the first failure entirely.
        run: |
          set -eo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
          grep -qE '^Ran [1-9][0-9]* tests?' /tmp/unittest.log || {
            echo "::error::unittest discovered no tests"
            exit 1
          }
      - name: Validate plugin manifest JSON
        run: |
          python3 -c "
          import json
          json.load(open('.claude-plugin/plugin.json'))
          json.load(open('.claude-plugin/marketplace.json'))
          "

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        # vitest reads the TypeScript sources directly, so no tsc build runs
        # first. It exits nonzero on a failing test and, unlike unittest, also
        # exits nonzero when it finds no test files at all.
        run: npm test
