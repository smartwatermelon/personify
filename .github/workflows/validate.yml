name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
        with:
          python-version: "3.12"
      - name: Validate SKILL.md structure
        run: python3 scripts/validate_skill.py
      - name: Validate plugin manifest JSON
        run: |
          python3 -c "
          import json
          json.load(open('.claude-plugin/plugin.json'))
          json.load(open('.claude-plugin/marketplace.json'))
          "
